<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img">
  <defs>
    <linearGradient id="gabg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B4327"/>
      <stop offset="100%" stop-color="#2A1B12"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#gabg)"/>
  <!-- back wall warm glow -->
  <circle cx="600" cy="300" r="260" fill="#C98A3C" opacity="0.18"/>
  <!-- shelf with cups -->
  <rect x="140" y="250" width="920" height="16" rx="8" fill="#DCC6A4" opacity="0.8"/>
  <g fill="#F3E6D0" opacity="0.9">
    <rect x="220" y="196" width="60" height="54" rx="10"/>
    <rect x="320" y="196" width="60" height="54" rx="10"/>
    <rect x="420" y="196" width="60" height="54" rx="10"/>
    <rect x="820" y="196" width="60" height="54" rx="10"/>
    <rect x="920" y="196" width="60" height="54" rx="10"/>
  </g>
  <!-- counter -->
  <rect x="0" y="640" width="1200" height="260" fill="#4a2e1a"/>
  <rect x="0" y="632" width="1200" height="16" fill="#DCC6A4"/>
  <!-- espresso machine -->
  <g>
    <rect x="470" y="420" width="260" height="220" rx="18" fill="#9A3324"/>
    <rect x="470" y="420" width="260" height="60" rx="18" fill="#2A1B12" opacity="0.3"/>
    <rect x="500" y="500" width="60" height="60" rx="10" fill="#2A1B12" opacity="0.5"/>
    <rect x="640" y="500" width="60" height="60" rx="10" fill="#2A1B12" opacity="0.5"/>
    <!-- group head + cup -->
    <rect x="560" y="560" width="80" height="18" rx="9" fill="#DCC6A4"/>
    <rect x="582" y="588" width="36" height="34" rx="8" fill="#FBF4E9"/>
  </g>
  <!-- steam -->
  <g stroke="#DCC6A4" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.4">
    <path d="M600 410 C 586 380 614 366 600 336"/>
  </g>
</svg>
