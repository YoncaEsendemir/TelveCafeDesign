<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a37"/>
      <stop offset="100%" stop-color="#4a2e1a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#lbg)"/>
  <!-- tall glass -->
  <g>
    <rect x="248" y="120" width="144" height="300" rx="20" fill="#FBF4E9" opacity="0.18"/>
    <rect x="256" y="128" width="128" height="284" rx="16" fill="#F3E6D0"/>
    <!-- layered latte: milk base, coffee, foam -->
    <rect x="256" y="300" width="128" height="112" rx="14" fill="#C98A3C"/>
    <rect x="256" y="220" width="128" height="86" fill="#6B4327"/>
    <rect x="256" y="150" width="128" height="78" rx="14" fill="#FBF4E9"/>
    <!-- latte art heart -->
    <path d="M320 176 c -12 -16 -36 -6 -36 12 c 0 16 24 28 36 40 c 12 -12 36 -24 36 -40 c 0 -18 -24 -28 -36 -12 z" fill="#C98A3C" opacity="0.5"/>
  </g>
  <!-- glass highlight -->
  <rect x="268" y="140" width="14" height="260" rx="7" fill="#FFFFFF" opacity="0.3"/>
</svg>
