<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img">
  <defs>
    <linearGradient id="gsbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a37"/>
      <stop offset="100%" stop-color="#3a2416"/>
    </linearGradient>
    <radialGradient id="win" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#F3E6D0"/>
      <stop offset="100%" stop-color="#C98A3C"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#gsbg)"/>
  <!-- window with warm light -->
  <rect x="120" y="90" width="420" height="440" rx="12" fill="url(#win)" opacity="0.9"/>
  <rect x="320" y="90" width="12" height="440" fill="#4a2e1a" opacity="0.6"/>
  <rect x="120" y="300" width="420" height="12" fill="#4a2e1a" opacity="0.6"/>
  <!-- hanging lamp -->
  <line x1="820" y1="80" x2="820" y2="210" stroke="#DCC6A4" stroke-width="5"/>
  <path d="M770 210 h100 l-20 60 h-60 z" fill="#9A3324"/>
  <circle cx="820" cy="276" r="16" fill="#C98A3C" opacity="0.8"/>
  <!-- floor -->
  <rect x="0" y="640" width="1200" height="260" fill="#2A1B12"/>
  <!-- table -->
  <rect x="640" y="560" width="360" height="24" rx="12" fill="#DCC6A4"/>
  <rect x="690" y="584" width="16" height="120" fill="#6B4327"/>
  <rect x="934" y="584" width="16" height="120" fill="#6B4327"/>
  <!-- cup on table -->
  <path d="M790 528 h60 l-7 30 a8 8 0 0 1 -8 7 h-30 a8 8 0 0 1 -8 -7 z" fill="#FBF4E9"/>
  <ellipse cx="820" cy="528" rx="30" ry="7" fill="#6B4327"/>
  <!-- cozy armchair -->
  <g fill="#9A3324">
    <rect x="200" y="470" width="220" height="180" rx="30"/>
    <rect x="180" y="500" width="50" height="150" rx="24"/>
    <rect x="390" y="500" width="50" height="150" rx="24"/>
  </g>
  <rect x="220" y="450" width="180" height="90" rx="26" fill="#b24334"/>
</svg>
